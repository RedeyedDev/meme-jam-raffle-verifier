<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meme Jam Raffle Verifier</title>
<meta name="description" content="Recompute any Meme Jam raffle draw yourself: seed commitment, drand beacon, ticket list, every winner.">
<meta name="theme-color" content="#140a1f">
<link rel="icon" type="image/png" href="./assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Display face = the game's: Lilita One for Latin, Nunito 800 for Cyrillic (one weight on purpose). */
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/lilita-one-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/lilita-one-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/nunito-800-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'MJ Display'; font-weight: 800; font-display: swap; src: url('./assets/fonts/nunito-800-cyrillic-ext.woff2') format('woff2');
    unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }

  :root {
    --bg: #140a1f; --bg2: #1e1030; --surface: #27173d; --surface2: #32204b; --line: #4a3566;
    --text: #fff6ee; --muted: #b9a8cc; --faint: #7d6b95;
    --action: #2ee6d6; --action-shadow: #157a70; --panel-shadow: 0 20px 40px rgba(0,0,0,.35);
    --orange: #ff7a1a; --orange-shadow: #b34e00; --teal: #2ee6d6; --teal-shadow: #157a70;
    --yellow: #ffd23f; --yellow-shadow: #b8940f; --red: #ff2d6b; --red-shadow: #a3153f;
    --green: #3ddc84; --purple: #7b2cff; --pink: #ff5fb0; --ink: #140a1f; --cream: #fff6ee;
    --ok: #2ee6d6; --bad: #ff2d6b; --warn: #ffd23f;
    --hot: linear-gradient(135deg, #ff9a1f 0%, #ff3d5a 45%, #8a2be2 100%);
    --display: 'MJ Display', 'Lilita One', 'Nunito', sans-serif;
    --body: 'Nunito', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.2, .8, .2, 1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme='dark']) {
      --bg: #fff6ef; --bg2: #fdece0; --surface: #ffffff; --surface2: #e2fbf8; --line: #ead9cc;
      --text: #1d0f2c; --muted: #6b5a80; --faint: #7a6a90;
      --action: #0e9e91; --action-shadow: #0a6f66; --panel-shadow: 0 6px 20px rgba(29,15,44,.08);
      --ok: #0e9e91; --bad: #d81b56; --warn: #a8750a;
    }
  }
  :root[data-theme='light'] {
    --bg: #fff6ef; --bg2: #fdece0; --surface: #ffffff; --surface2: #e2fbf8; --line: #ead9cc;
    --text: #1d0f2c; --muted: #6b5a80; --faint: #7a6a90;
    --action: #0e9e91; --action-shadow: #0a6f66; --panel-shadow: 0 6px 20px rgba(29,15,44,.08);
    --ok: #0e9e91; --bad: #d81b56; --warn: #a8750a;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 700 15px/1.5 var(--body); }
  a { color: var(--action); }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  .mono { font-family: var(--mono); font-weight: 500; overflow-wrap: anywhere; }
  .disp { font-family: var(--display); font-weight: 800; letter-spacing: .5px; }

  /* ── hero ── */
  .hero { position: relative; background: var(--hot); color: var(--cream); overflow: hidden; padding: calc(14px + env(safe-area-inset-top)) 0 84px; }
  .hero svg.court { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .16; pointer-events: none; }
  .hero .wrap { position: relative; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--cream); }
  .brand img { height: 46px; width: auto; filter: drop-shadow(0 4px 0 rgba(20,10,31,.35)); }
  .brand span { font: 800 12px/1 var(--display); letter-spacing: 1.5px; opacity: .9; }
  .lang { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(20,10,31,.32); }
  .lang button { background: none; border: 0; border-radius: 9px; padding: 6px 10px; cursor: pointer; font: 800 12px/1 var(--display); letter-spacing: 1px; color: rgba(255,246,238,.75); }
  .lang button[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
  .hero-main { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; margin-top: 26px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 10px; background: rgba(20,10,31,.32); font: 800 11px/1 var(--display); letter-spacing: 1.5px; }
  .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px rgba(46,230,214,.3); }
  h1 { margin: 12px 0 10px; font: 800 clamp(34px, 7.2vw, 60px)/.98 var(--display); letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 5px 0 rgba(20,10,31,.35); }
  .hero p { margin: 0; max-width: 560px; font-size: 15px; line-height: 1.5; color: rgba(255,246,238,.92); }
  .medal { width: 168px; height: 168px; flex: none; transform: rotate(8deg); filter: drop-shadow(0 10px 0 rgba(20,10,31,.3)); animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: rotate(4deg) translateY(-8px); } }

  /* ── panels / form ── */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--panel-shadow); }
  .form { position: relative; margin-top: -56px; border-width: 2px; }
  .fields { display: grid; grid-template-columns: 1fr 190px auto; gap: 10px; }
  label.f { display: block; }
  label.f span { display: block; margin: 0 0 5px 4px; font: 800 11px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); }
  input, textarea { width: 100%; min-width: 0; background: var(--bg); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 0 14px; height: 52px; font: 500 14px/1 var(--mono); outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus { border-color: var(--action); box-shadow: 0 0 0 3px color-mix(in srgb, var(--action) 30%, transparent); }
  input::placeholder { color: var(--faint); font-family: var(--body); font-weight: 700; }
  textarea { height: auto; min-height: 120px; padding: 12px 14px; font-size: 12px; line-height: 1.5; }
  .btn { align-self: end; height: 52px; padding: 0 26px; border: 1.5px solid var(--orange-shadow); border-radius: 18px; background: var(--orange); color: var(--ink); cursor: pointer;
    font: 800 18px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase; box-shadow: 0 5px 0 var(--orange-shadow); transition: transform .12s var(--out), box-shadow .12s var(--out); }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 0 var(--orange-shadow); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--orange-shadow); }
  .btn:disabled { opacity: .6; cursor: default; transform: none; }
  details.adv { margin-top: 12px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '▸'; color: var(--faint); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  .adv p { margin: 10px 0 8px; font-size: 13px; color: var(--muted); }
  .adv input { margin-top: 8px; height: 44px; font-size: 13px; }

  /* ── sections ── */
  h2 { margin: 34px 0 12px; display: flex; align-items: center; gap: 10px; font: 800 20px/1.1 var(--display); letter-spacing: 1px; text-transform: uppercase; }
  h2 small { font: 800 12px/1 var(--display); letter-spacing: 1px; color: var(--faint); }
  h2::before { content: ''; width: 10px; height: 22px; border-radius: 4px; background: var(--hot); flex: none; }
  .muted { color: var(--muted); }
  .rise { animation: rise .45s var(--out) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  /* ── verdict stamp ── */
  .verdict { position: relative; margin-top: 22px; border-radius: 22px; padding: 20px 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; color: var(--ink); overflow: hidden; }
  .verdict.ok { background: var(--teal); box-shadow: 0 6px 0 var(--teal-shadow); }
  .verdict.bad { background: var(--red); box-shadow: 0 6px 0 var(--red-shadow); color: var(--cream); }
  .verdict.wait { background: var(--yellow); box-shadow: 0 6px 0 var(--yellow-shadow); }
  .verdict.load { background: var(--surface); box-shadow: none; border: 1px solid var(--line); color: var(--text); }
  .verdict .ico { grid-row: span 2; width: 62px; height: 62px; border-radius: 18px; background: var(--ink); color: var(--cream); display: grid; place-items: center; font: 800 32px/1 var(--display); transform: rotate(-6deg); animation: pop .5s var(--spring) both; }
  .verdict.bad .ico { color: var(--red); } .verdict.ok .ico { color: var(--teal); } .verdict.wait .ico { color: var(--yellow); }
  @keyframes pop { from { transform: rotate(-30deg) scale(.2); opacity: 0; } }
  .verdict b { font: 800 clamp(26px, 6vw, 38px)/1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; }
  .verdict span.sub { font-size: 14px; line-height: 1.4; opacity: .88; }
  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.6s var(--out) both; }
  @keyframes fall { to { transform: translateY(190px) rotate(540deg); opacity: 0; } }
  .spin { width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--orange); animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ── raffle head + stats ── */
  .rhead { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .rhead .num { padding: 6px 12px; border-radius: 12px; background: var(--hot); color: var(--cream); font: 800 16px/1 var(--display); letter-spacing: 1px; }
  .rhead .ttl { font: 800 22px/1.15 var(--display); letter-spacing: .5px; flex: 1 1 200px; }
  .pill { padding: 5px 10px; border-radius: 10px; font: 800 11px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
  .pill.done { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .stats { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--panel-shadow); min-width: 0; }
  .stat b { display: block; font: 800 26px/1.05 var(--display); letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat span { display: block; margin-top: 4px; font: 800 10.5px/1.2 var(--display); letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint); }
  .stats.two { grid-template-columns: 1fr 1fr; } .stats.two .stat b { font-size: 22px; }
  .stat a { color: inherit; text-decoration-color: var(--action); }

  /* ── formula: seed + drand = key ── */
  .formula { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 8px; align-items: stretch; }
  .half { position: relative; background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 18px; padding: 14px; min-width: 0; box-shadow: var(--panel-shadow); display: flex; flex-direction: column; gap: 8px; }
  .half.dim { opacity: .55; }
  .half h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 800 15px/1 var(--display); letter-spacing: 1.2px; text-transform: uppercase; color: var(--text); }
  .half h3 i { width: 28px; height: 28px; border-radius: 9px; background: var(--c); color: var(--ink); display: grid; place-items: center; font-style: normal; font-size: 15px; }
  .half p { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  .op { align-self: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; font: 800 18px/1 var(--display); color: var(--muted); }
  .kv { min-width: 0; }
  .kv > span { display: block; font: 800 10px/1 var(--display); letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
  .hash { display: block; width: 100%; text-align: left; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 7px 9px; cursor: pointer; font: 500 11px/1.45 var(--mono); color: var(--text); overflow-wrap: anywhere; position: relative; transition: border-color .15s; }
  .hash:hover { border-color: var(--action); }
  .hash.copied { border-color: var(--ok); border-style: solid; }
  .hash.copied::after { content: attr(data-ok); position: absolute; right: 6px; top: -9px; padding: 2px 6px; border-radius: 6px; background: var(--ok); color: var(--ink); font: 800 9px/1.2 var(--display); letter-spacing: 1px; }

  /* ── timeline ── */
  .tl { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--panel-shadow); }
  .tl .n b { display: block; font: 800 13px/1.15 var(--display); letter-spacing: 1px; text-transform: uppercase; }
  .tl .n span { display: block; margin-top: 3px; font: 500 11px/1.3 var(--mono); color: var(--muted); }
  .tl .gap { text-align: center; padding: 4px 10px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--line); font: 800 12px/1 var(--display); letter-spacing: .8px; color: var(--action); white-space: nowrap; }

  /* ── checks ── */
  ul.checks { list-style: none; margin: 0; padding: 4px 16px; }
  ul.checks li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); animation: rise .4s var(--out) both; }
  ul.checks li:last-child { border-bottom: 0; }
  .ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--display); color: var(--ink); }
  .ci.ok { background: var(--ok); } .ci.bad { background: var(--bad); color: var(--cream); } .ci.warn { background: var(--warn); } .ci.info { background: var(--surface2); color: var(--muted); border: 1px solid var(--line); }
  ul.checks .t { font-size: 14px; line-height: 1.4; }
  ul.checks .d { display: block; margin-top: 3px; font: 500 11px/1.45 var(--mono); color: var(--faint); overflow-wrap: anywhere; }

  /* ── you ── */
  .you { margin-top: 12px; border: 2px solid var(--action); background: color-mix(in srgb, var(--action) 9%, var(--surface)); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
  .you .tag { grid-row: span 2; padding: 12px 14px; border-radius: 16px; background: var(--action); color: var(--ink); text-align: center; box-shadow: 0 4px 0 var(--action-shadow); }
  .you .tag small { display: block; font: 800 10px/1 var(--display); letter-spacing: 1.4px; }
  .you .tag b { display: block; margin-top: 3px; font: 800 20px/1 var(--display); }
  .you .line { font-size: 14px; line-height: 1.4; }
  .you .line b { font-family: var(--display); letter-spacing: .5px; }
  .bar { height: 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; min-width: 4px; border-radius: 6px; background: var(--hot); }
  .you .won { grid-column: 1 / -1; margin-top: 4px; padding: 9px 12px; border-radius: 12px; background: var(--yellow); color: var(--ink); font-size: 14px; }

  /* ── winners ── */
  .rows { padding: 4px 6px; }
  .wrow { display: grid; grid-template-columns: 38px 1fr auto 26px; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; }
  .wrow + .wrow { margin-top: 2px; }
  .wrow.me { background: color-mix(in srgb, var(--action) 16%, transparent); box-shadow: inset 0 0 0 1.5px var(--action); }
  .wrow .n { width: 38px; height: 38px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); display: grid; place-items: center; font: 800 16px/1 var(--display); color: var(--muted); }
  .wrow:nth-child(1) .n { background: var(--yellow); color: var(--ink); border-color: var(--yellow-shadow); }
  .wrow:nth-child(2) .n { background: #c9ced8; color: var(--ink); border-color: #8d93a0; }
  .wrow:nth-child(3) .n { background: #c98a12; color: var(--ink); border-color: #8a5e0a; }
  .wrow .p { min-width: 0; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .wrow .p em { font-style: normal; margin-left: 6px; padding: 2px 6px; border-radius: 6px; background: var(--action); color: var(--ink); font: 800 9.5px/1 var(--display); letter-spacing: 1px; vertical-align: 2px; }
  .wrow .u { text-align: right; font: 500 13px/1.3 var(--mono); }
  .wrow .u small { display: block; font-size: 10.5px; color: var(--bad); }
  .colhint { display: flex; justify-content: flex-end; padding: 8px 46px 0 0; font: 800 10px/1 var(--display); letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint); }

  /* ── ticket list ── */
  details.tix { margin-top: 12px; }
  details.tix > summary { font: 800 14px/1 var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--text); padding: 4px 0; }
  .tlist { margin-top: 10px; max-height: 340px; overflow-y: auto; padding: 8px 12px; }
  .trow { display: grid; grid-template-columns: 78px 1fr 54px 56px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 8px; font: 500 12px/1.3 var(--mono); }
  .trow.me { background: color-mix(in srgb, var(--action) 18%, transparent); }
  .trow .c { text-align: right; color: var(--action); } .trow .pc { text-align: right; color: var(--faint); }

  /* ── how it works ── */
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; counter-reset: s; margin: 0; padding: 0; list-style: none; }
  .steps li { counter-increment: s; position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 14px 58px; font-size: 13.5px; line-height: 1.5; color: var(--muted); box-shadow: var(--panel-shadow); }
  .steps li::before { content: counter(s); position: absolute; left: 12px; top: 12px; width: 34px; height: 34px; border-radius: 11px; background: var(--c, var(--orange)); color: var(--ink); display: grid; place-items: center; font: 800 18px/1 var(--display); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .steps li:nth-child(5n+1) { --c: var(--orange); } .steps li:nth-child(5n+2) { --c: var(--teal); } .steps li:nth-child(5n+3) { --c: var(--yellow); } .steps li:nth-child(5n+4) { --c: var(--pink); } .steps li:nth-child(5n+5) { --c: var(--green); }
  .steps li:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .steps code, code.k { font: 500 12px/1.4 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }

  footer { margin: 44px 0 0; padding: 22px 0 calc(40px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }

  @media (max-width: 720px) {
    .hero { padding-bottom: 76px; }
    .hero-main { grid-template-columns: 1fr; }
    .medal { position: absolute; right: -18px; top: 52px; width: 104px; height: 104px; opacity: .95; }
    h1 { max-width: calc(100% - 84px); }
    .brand img { height: 40px; }
    .fields { grid-template-columns: 1fr; }
    .btn { width: 100%; height: 56px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .formula { grid-template-columns: 1fr; }
    .op { justify-self: center; }
    .tl { grid-template-columns: 1fr; }
    .tl .gap { justify-self: start; }
    .steps { grid-template-columns: 1fr; }

  // English unless explicitly chosen; no auto-detect from the browser language.
  const q = (qs.get('lang') || '').toLowerCase().slice(0, 2);
  return q === 'uk' ? 'ua' : q in I18N ? q : 'en';
})();
const t = (k, vars = {}) => String(I18N[lang][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n) => Number(n).toLocaleString(LANGS[lang]);
const dt = (v) => new Date(v).toLocaleString(LANGS[lang], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23', timeZone: 'UTC' }) + ' UTC';

function applyLang() {
  document.documentElement.lang = LANGS[lang];
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('steps').innerHTML = I18N[lang].steps.map((s) => `<li>${s}</li>`).join('');
  if (lastRender) lastRender(false);
}

// ── crypto ────────────────────────────────────────────────────────────
const enc = new TextEncoder();
const hex = (buf) => [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
const unhex = (h) => new Uint8Array(h.match(/.{2}/g).map((b) => parseInt(b, 16)));
const sha256 = async (bytes) => new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
async function hmac(keyStr, msgStr) {
  const key = await crypto.subtle.importKey('raw', enc.encode(keyStr), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(msgStr)));
}

let blsPromise = null;
const loadBls = () => (blsPromise ??= import('./vendor/noble-bls12-381.js').then((m) => m.bls12_381).catch(() => null));

async function verifyBls(beacon) {
  const bls = await loadBls();
  if (!bls) return null;
  const roundBytes = new Uint8Array(8);
  new DataView(roundBytes.buffer).setBigUint64(0, BigInt(beacon.round));
  const msg = await sha256(roundBytes);
  try {
    const point = bls.G1.ProjectivePoint.fromAffine(bls.G1.hashToCurve(msg, { DST: DRAND.dst }).toAffine());
    return bls.verifyShortSignature(beacon.signature, point, DRAND.publicKey);
  } catch {
    return false;
  }
}

async function fetchJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} → HTTP ${r.status}`);
  return r.json();
}
async function fetchBeacon(round) {
  let last;
  for (const relay of DRAND.relays) {
    try { return await fetchJson(`${relay}/${DRAND.chainHash}/public/${round}`); } catch (e) { last = e; }
  }
  throw last;
}
const roundTimeSec = (round) => DRAND.genesis + (Number(round) - 1) * DRAND.period;
const roundUrl = (round) => `${DRAND.relays[0]}/${DRAND.chainHash}/public/${round}`;

// ── verification ──────────────────────────────────────────────────────
// Checks carry an i18n key + vars, not text, so switching the language re-renders them.
async function verify(data) {
  const checks = [];
  const add = (status, key, vars, detail) => checks.push({ status, key, vars, detail });
  const seed = data.drawSeed;

  const seedHash = hex(await sha256(enc.encode(seed)));
  add(seedHash === String(data.drawSeedHash).toLowerCase() ? 'ok' : 'bad', 'cSeed', {}, seedHash);

  let drawKey = seed;
  let timing = null;
  if (data.drandRound) {
    const beacon = await fetchBeacon(data.drandRound);
    const sigOk = Number(beacon.round) === Number(data.drandRound) ? await verifyBls(beacon) : false;
    if (sigOk === null) add('warn', 'cBeaconSigSkip');
    else add(sigOk ? 'ok' : 'bad', 'cBeaconSig', { r: data.drandRound }, roundUrl(data.drandRound));
    const rand = hex(await sha256(unhex(beacon.signature)));
    add(rand === beacon.randomness ? 'ok' : 'bad', 'cBeaconRand', {}, rand);
    add(beacon.randomness === data.drandRandomness ? 'ok' : 'bad', 'cBeaconMatch');
    const roundTime = roundTimeSec(data.drandRound);
    const closeGap = Math.round(roundTime - Date.parse(data.endAt) / 1000);
    add(closeGap >= CLOSE_MARGIN_SEC ? 'ok' : 'bad', 'cTiming', { d: closeGap, m: CLOSE_MARGIN_SEC }, new Date(roundTime * 1000).toISOString());
    timing = { roundTime, closeGap, drawGap: null };
    if (data.drawnAt) {
      const drawGap = Math.round(Date.parse(data.drawnAt) / 1000 - roundTime);
      add(drawGap >= 0 ? 'ok' : 'bad', 'cDrawn', { d: drawGap });
      timing.drawGap = drawGap;
    }
    drawKey = hex(await hmac(seed, beacon.randomness));
  } else {
    add('info', 'cLegacy');
  }

  const entries = (data.participants || [])
    .map((p) => (Array.isArray(p) ? [Number(p[0]), Number(p[1])] : [Number(p.userId), Number(p.ticketCount)]))
    .filter((e) => e[1] > 0)
    .sort((a, b) => a[0] - b[0]);
  const snapshot = entries.map((e) => [...e]);
  const totalTickets = entries.reduce((s, e) => s + e[1], 0);
  const ticketHash = hex(await sha256(enc.encode(JSON.stringify(entries))));
  add(ticketHash === String(data.ticketListHash).toLowerCase() ? 'ok' : 'bad', 'cTickets', { p: entries.length, t: totalTickets }, ticketHash);

  const rows = [];
  for (const w of data.winners || []) {
    if (!entries.length) { rows.push({ w, uid: null }); continue; }
    const h = await hmac(drawKey, `${data.contestId}:${w.drawIndex}:${ticketHash}`);
    const num = new DataView(h.buffer).getUint32(0);
    const target = (num / 0x100000000) * entries.reduce((s, e) => s + e[1], 0);
    let acc = 0, idx = 0;
    for (let i = 0; i < entries.length; i++) { acc += entries[i][1]; if (target < acc) { idx = i; break; } }
    const uid = entries[idx][0];
    rows.push({ w, uid });
    entries[idx][1] -= 1;
    if (entries[idx][1] <= 0) entries.splice(idx, 1);
  }
  const mismatches = rows.filter((r) => r.uid !== Number(r.w.userId)).length;
  if (rows.length) add(mismatches ? 'bad' : 'ok', mismatches ? 'cWinnersBad' : 'cWinners', { n: mismatches || rows.length, total: rows.length });

  return { checks, rows, snapshot, totalTickets, drawKey, timing, ok: checks.every((c) => c.status !== 'bad') };
}

// ── rendering ─────────────────────────────────────────────────────────
let lastRender = null;
let lookedUpByHash = false;
let countdownTimer = null;
const ICON = { ok: '✓', bad: '✗', warn: '!', info: '·' };
const CONFETTI = ['#ff7a1a', '#ffd23f', '#ff2d6b', '#7b2cff', '#fff6ee', '#3ddc84'];

const titleOf = (d) => (lang === 'ru' ? d.titleRu : lang === 'ua' ? d.titleUa : d.titleEn) || d.title || '';
const hashBtn = (label, value) => `<div class="kv"><span>${esc(label)}</span><button type="button" class="hash" data-copy="${esc(value)}" data-ok="${esc(t('copy'))}">${esc(value)}</button></div>`;
const verdict = (cls, ico, title, sub, extra = '') => `<div class="verdict ${cls} rise">${extra}<div class="ico">${ico}</div><b>${esc(title)}</b><span class="sub">${sub}</span></div>`;
const confetti = () => `<div class="confetti" aria-hidden="true">${Array.from({ length: 22 }, (_, i) =>
  `<i style="left:${(i * 4.7 + 2) % 100}%;background:${CONFETTI[i % CONFETTI.length]};animation-delay:${(i % 7) * 70}ms;transform:rotate(${i * 37}deg)"></i>`).join('')}</div>`;

function head(data, drawn) {
  return `<div class="rhead rise">
    <span class="num">#${esc(data.contestId)}</span><span class="ttl">${esc(titleOf(data))}</span>
    ${lookedUpByHash ? `<span class="pill">${esc(t('foundByHash'))}</span>` : ''}
    <span class="pill ${drawn ? 'done' : ''}">${esc(t(drawn ? 'stDone' : 'stWait'))}</span></div>`;
}
const stat = (value, label) => `<div class="stat"><b>${value}</b><span>${esc(label)}</span></div>`;
const roundLink = (r) => `<a href="${roundUrl(r)}" target="_blank" rel="noopener">${esc(r)}</a>`;

function formula(data, res) {
  const drawn = !!res;
  const beacon = !!data.drandRound;
  const seedHalf = `<div class="half" style="--c:var(--orange)"><h3><i>🔒</i>${esc(t('seed'))}</h3><p>${esc(t('seedSub'))}</p>
    ${hashBtn(t('commitment'), data.drawSeedHash)}
    ${drawn ? hashBtn(t('seedRev'), data.drawSeed) : `<div class="kv"><span>${esc(t('seedSealed'))}</span><div class="hash" style="cursor:default">••••••••••••••••••••••••••••••••</div></div>`}</div>`;
  const drandHalf = `<div class="half ${drawn && !beacon ? 'dim' : ''}" style="--c:var(--teal)"><h3><i>🎲</i>${esc(t('drand'))}</h3>
    <p>${esc(drawn && !beacon ? t('drandLegacy') : beacon ? t('drandSub') : t('notPinned'))}</p>
    ${beacon ? `<div class="kv"><span>${esc(t('round'))}</span><a class="hash" style="text-decoration:none;cursor:pointer" href="${roundUrl(data.drandRound)}" target="_blank" rel="noopener">#${esc(data.drandRound)} · ${esc(dt(roundTimeSec(data.drandRound) * 1000))} ↗</a></div>` : ''}
    ${beacon && data.drandRandomness ? hashBtn(t('randomness'), data.drandRandomness) : ''}</div>`;
  const keyHalf = `<div class="half" style="--c:var(--yellow)"><h3><i>🔑</i>${esc(t('key'))}</h3>
    <p>${esc(!drawn ? t('keyLater') : beacon ? t('keySub') : t('keyLegacy'))}</p>
    ${drawn ? hashBtn(beacon ? 'HMAC-SHA256' : 'seed', res.drawKey) : ''}</div>`;
  return `<h2 class="rise">${esc(t('fTitle'))}</h2><div class="formula rise">${seedHalf}<div class="op">+</div>${drandHalf}<div class="op">=</div>${keyHalf}</div>`;
}

function fmtLeft(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  const p = (n) => String(n).padStart(2, '0');
  return (d ? `${d}d ` : '') + `${p(h)}:${p(m)}:${p(s % 60)}`;
}

function renderPending(data) {
  lastRender = () => {
    clearInterval(countdownTimer);
    const endMs = data.endAt ? Date.parse(data.endAt) : null;
    const left = () => (endMs && endMs > Date.now() ? t('endsIn', { t: fmtLeft(endMs - Date.now()) }) : t('closed'));
    $('out').innerHTML = `
      ${verdict('wait', '⏳', t('vWait'), `${esc(t('vWaitSub'))}<br><b id="cd" style="font:800 15px/1.6 var(--display);letter-spacing:.8px;text-transform:none">${esc(left())}</b>`)}
      ${head(data, false)}
      <div class="stats two rise">
        ${stat(data.endAt ? esc(new Date(data.endAt).toLocaleString(LANGS[lang], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })) : '—', t('sCloses'))}
        ${stat(data.drandRound ? roundLink(data.drandRound) : '—', data.drandRound ? t('sRound') : `${t('sRound')}: ${t('sNone')}`)}
      </div>
      ${formula(data, null)}`;
    if (endMs) countdownTimer = setInterval(() => { const el = $('cd'); if (el) el.textContent = left(); }, 1000);
  };
  lastRender();
}

function renderResult(data, res) {
  let first = true;
  lastRender = () => {
    clearInterval(countdownTimer);
    const me = Number($('me').value) || null;
    const mine = me ? res.snapshot.find((e) => e[0] === me) : null;
    const myWins = me ? res.rows.filter((r) => Number(r.w.userId) === me) : [];
    const maxT = Math.max(1, ...res.snapshot.map((e) => e[1]));
    const youBlock = !me ? '' : `<div class="you rise">
        <div class="tag"><small>${esc(t('youTag'))}</small><b>#${esc(me)}</b></div>
        ${mine
          ? `<div class="line">${t('you', { t: nf(mine[1]), total: nf(res.totalTickets), pct: ((mine[1] / res.totalTickets) * 100).toFixed(2) })}</div>
             <div class="bar"><i style="width:${((mine[1] / res.totalTickets) * 100).toFixed(2)}%"></i></div>
             <div class="won" ${myWins.length ? '' : 'style="background:var(--surface2);color:var(--muted)"'}>${myWins.length
               ? esc(t('youWon', { list: myWins.map((r) => r.w.displayName || `#${r.w.prizeId}`).join(', ') }))
               : esc(t('youLost'))}</div>`
          : `<div class="line" style="grid-row:span 2">${esc(t('youNone', { id: me }))}</div>`}
      </div>`;
    const tm = res.timing;
    const timeline = !tm ? '' : `<div class="tl rise">
        <div class="n"><b>${esc(t('tlClosed'))}</b><span>${esc(dt(data.endAt))}</span></div>
        <div class="gap">+${nf(tm.closeGap)} s →</div>
        <div class="n"><b>${esc(t('tlRound'))}</b><span>#${esc(data.drandRound)} · ${esc(dt(tm.roundTime * 1000))}</span></div>
        <div class="gap">${tm.drawGap == null ? '→' : `+${nf(tm.drawGap)} s →`}</div>
        <div class="n"><b>${esc(t('tlDrawn'))}</b><span>${data.drawnAt ? esc(dt(data.drawnAt)) : '—'}</span></div>
      </div>`;
    $('out').innerHTML = `
      ${res.ok ? verdict('ok', '✓', t('vOk'), esc(t('vOkSub')), first ? confetti() : '') : verdict('bad', '✗', t('vBad'), esc(t('vBadSub')))}
      ${head(data, true)}
      <div class="stats rise">
        ${stat(nf(res.snapshot.length), t('sPlayers'))}${stat(nf(res.totalTickets), t('sTickets'))}${stat(nf(res.rows.length), t('sPrizes'))}
        ${stat(data.drandRound ? roundLink(data.drandRound) : '—', t('sRound'))}
      </div>
      ${youBlock}
      ${formula(data, res)}
      ${timeline}
      <h2 class="rise">${esc(t('checks'))} <small>${res.checks.filter((c) => c.status === 'ok').length}/${res.checks.filter((c) => c.status !== 'info').length}</small></h2>
      <div class="panel rise" style="padding:0"><ul class="checks">${res.checks.map((c, i) => `
        <li style="animation-delay:${first ? i * 70 : 0}ms"><span class="ci ${c.status}">${ICON[c.status]}</span>
        <span class="t">${esc(t(c.key, c.vars))}${c.detail ? `<span class="d">${esc(c.detail)}</span>` : ''}</span></li>`).join('')}
      </ul></div>
      <h2 class="rise">${esc(t('winners'))} <small>${res.rows.length}</small></h2>
      ${res.rows.length ? `<div class="panel rise" style="padding:0"><div class="colhint">${esc(t('colHint'))}</div><div class="rows">${res.rows.map((r, i) => {
        const ok = r.uid === Number(r.w.userId);
        const isMe = me && Number(r.w.userId) === me;
        return `<div class="wrow ${isMe ? 'me' : ''}">
          <span class="n">${i + 1}</span>
          <span class="p">${esc(r.w.displayName || `#${r.w.prizeId}`)}${isMe ? `<em>${esc(t('youTag'))}</em>` : ''}</span>
          <span class="u">#${esc(r.uid ?? '—')}${ok ? '' : `<small>${esc(t('announced'))} #${esc(r.w.userId)}</small>`}</span>
          <span class="ci ${ok ? 'ok' : 'bad'}" style="width:24px;height:24px;font-size:13px">${ok ? '✓' : '✗'}</span></div>`;
      }).join('')}</div></div>` : `<div class="panel rise muted">${esc(t('noWinners'))}</div>`}
      <details class="tix rise"><summary>${esc(t('participants'))} · ${nf(res.snapshot.length)}</summary>
        <div class="panel tlist">${res.snapshot.map(([u, c]) => `
          <div class="trow ${u === me ? 'me' : ''}"><span>#${u}</span><span class="bar"><i style="width:${(c / maxT) * 100}%"></i></span><span class="c">×${nf(c)}</span><span class="pc">${((c / res.totalTickets) * 100).toFixed(1)}%</span></div>`).join('')}
        </div>
      </details>`;
    first = false;
  };
  lastRender();
}

async function run() {
  const btn = $('run');
  btn.disabled = true;
  clearInterval(countdownTimer);
  lastRender = null;
  $('out').innerHTML = verdict('load', '', t('loading'), esc(t('loadingSub'))).replace('<div class="ico"></div>', '<div class="spin" style="grid-row:span 2"></div>').replace('<b>', '<b style="font-size:20px">');
  try {
    let data;
    lookedUpByHash = false;
    const pasted = $('json').value.trim();
    if (pasted) {
      data = JSON.parse(pasted);
    } else {
      const q = $('contest').value.trim().replace(/^#/, '');
      const api = $('api').value.trim().replace(/\/$/, '');
      const url = new URL(location.href);
      url.searchParams.delete('contest');
      url.searchParams.delete('hash');
      if (/^[0-9a-f]{64}$/i.test(q)) {
        url.searchParams.set('hash', q.toLowerCase());
        history.replaceState(null, '', url);
        const r = await fetch(`${api}/contests/fairness/by-hash/${q.toLowerCase()}`);
        if (r.status === 404) throw new Error(t('hashNotFound'));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        data = await r.json();
        lookedUpByHash = true;
      } else if (/^\d+$/.test(q)) {
        url.searchParams.set('contest', q);
        history.replaceState(null, '', url);
        const r = await fetch(`${api}/contests/${q}/fairness`);
        if (r.status === 404) throw new Error(t('notFound', { id: q }));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        data = await r.json();
      } else {
        throw new Error(t('badInput'));
      }
    }
    if (data.status !== 'completed' || !data.drawSeed) renderPending(data);
    else renderResult(data, await verify(data));
  } catch (e) {
    lastRender = null;
    $('out').innerHTML = verdict('bad', '!', t('vErr'), esc(t('error')) + esc(e.message));
  } finally {
    btn.disabled = false;
  }
}

document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  const url = new URL(location.href);
  url.searchParams.set('lang', lang);
  history.replaceState(null, '', url);
  applyLang();
}));
$('run').addEventListener('click', run);
$('contest').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
$('me').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
$('me').addEventListener('input', () => lastRender && lastRender());
$('out').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-copy]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch { return; }
  b.classList.add('copied');
  setTimeout(() => b.classList.remove('copied'), 1400);
});
applyLang();
loadBls();

if (qs.get('me')) $('me').value = qs.get('me');
const preset = qs.get('hash') || qs.get('contest');
if (preset) { $('contest').value = preset; run(); }
</script>
</body>
</html>
